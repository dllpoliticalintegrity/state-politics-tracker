name: LPT publish

# Nightly: refreshes the hub caches in the Local Politics Tracker project
# for the states the site still reads from Henry's tables (Oregon and Iowa,
# as of 2026-10-18), after his weekday 15:00 UTC refresh.
#
# On manual dispatch with a state list it also runs the bridge: copies that
# state's settled cf_* rows from the tracker into LPT's <st>_* tables
# (docs/lpt-frontend-plan.md, section 0). The tracker is the site's store
# now, so the scheduled run bridges nothing.

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      states:
        description: "Space-separated states to bridge into LPT (e.g. mi tx ca); blank = refresh caches only"
        required: false
        default: ""
      dry_run:
        description: "Read and report only"
        type: boolean
        default: false
      limit:
        description: "First N transaction rows per table (a smoke test; skips prune)"
        required: false
        default: ""
      force_prune:
        description: "Allow a prune larger than 20% of a table"
        type: boolean
        default: false

concurrency:
  group: lpt-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish
        env:
          # Every tracker table read here is public, so the publishable key is
          # enough (least privilege next to LPT's service key).
          SUPABASE_URL: https://lohxdfrxnxuxjdvvyfjc.supabase.co
          SUPABASE_KEY: sb_publishable_r8D7t0Stine_UgCoU_ps8g_UDRKSpoX
          LPT_SUPABASE_URL: https://rwiueylzgcgnzypdyszi.supabase.co
          LPT_SERVICE_ROLE_KEY: ${{ secrets.LPT_SERVICE_ROLE_KEY }}
          STATES: ${{ inputs.states }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
          FORCE_PRUNE: ${{ inputs.force_prune }}
        run: |
          if [ -z "$STATES" ]; then
            echo "No states to bridge (the tracker is the site's store); refreshing LPT caches only."
            exit 0
          fi
          if [ -z "$LPT_SERVICE_ROLE_KEY" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::warning::LPT_SERVICE_ROLE_KEY secret not set — skipping LPT publish."
            exit 0
          fi
          status=0
          for st in $STATES; do
            python3 pipelines/lpt/publish_state.py --state "$st" \
              ${DRY_RUN:+$( [ "$DRY_RUN" = "true" ] && echo --dry-run )} \
              ${LIMIT:+--limit "$LIMIT"} \
              $( [ "$FORCE_PRUNE" = "true" ] && echo --force-prune ) || status=1
          done
          exit $status

      # The states still read from Henry's tables use the hub's caches over
      # his matviews; refill them here, after his weekday 15:00 UTC refresh.
      - name: Refresh hub caches for the states still on LPT
        env:
          LPT_SUPABASE_URL: https://rwiueylzgcgnzypdyszi.supabase.co
          LPT_SERVICE_ROLE_KEY: ${{ secrets.LPT_SERVICE_ROLE_KEY }}
          HIS_STATES: ${{ vars.LPT_HIS_STATES || 'OR IA' }}
        run: |
          if [ -z "$LPT_SERVICE_ROLE_KEY" ]; then exit 0; fi
          # One call per state: the refresh is one transaction, and PostgREST
          # cancels a service-role statement after 30 s, so a slow state
          # (Iowa took 69 s on 2026-10-18) must not roll back the others.
          status=0
          for st in $HIS_STATES; do
            echo "refreshing $st"
            curl -fsS -X POST "${LPT_SUPABASE_URL}/rest/v1/rpc/hub_refresh_cache" \
              -H "apikey: ${LPT_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${LPT_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" -m 3600 \
              -d "{\"p_states\": [\"${st}\"]}" || { echo "::warning::hub_refresh_cache failed for $st"; status=1; }
          done
          exit $status
