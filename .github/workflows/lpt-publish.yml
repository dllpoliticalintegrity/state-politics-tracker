name: LPT publish

# Copies the hub's own states (Michigan, Texas, California) from the
# tracker's settled cf_* rows into the Local Politics Tracker project's
# <st>_* tables and refreshes LPT's hub caches — the bridge in
# docs/lpt-frontend-plan.md. Runs after the three importers have published
# (MI 07:20, CA 10:30, TX 14:30 UTC).

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      states:
        description: "Space-separated states (mi tx ca)"
        required: false
        default: "mi tx ca"
      dry_run:
        description: "Read and report only"
        type: boolean
        default: false
      limit:
        description: "First N transaction rows per table (a smoke test; skips prune)"
        required: false
        default: ""
      force_prune:
        description: "Allow a prune larger than 20% of a table"
        type: boolean
        default: false

concurrency:
  group: lpt-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish
        env:
          # Every tracker table read here is public, so the publishable key is
          # enough (least privilege next to LPT's service key).
          SUPABASE_URL: https://lohxdfrxnxuxjdvvyfjc.supabase.co
          SUPABASE_KEY: sb_publishable_r8D7t0Stine_UgCoU_ps8g_UDRKSpoX
          LPT_SUPABASE_URL: https://rwiueylzgcgnzypdyszi.supabase.co
          LPT_SERVICE_ROLE_KEY: ${{ secrets.LPT_SERVICE_ROLE_KEY }}
          STATES: ${{ inputs.states || 'mi tx ca' }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
          FORCE_PRUNE: ${{ inputs.force_prune }}
        run: |
          if [ -z "$LPT_SERVICE_ROLE_KEY" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::warning::LPT_SERVICE_ROLE_KEY secret not set — skipping LPT publish."
            exit 0
          fi
          status=0
          for st in $STATES; do
            python3 pipelines/lpt/publish_state.py --state "$st" \
              ${DRY_RUN:+$( [ "$DRY_RUN" = "true" ] && echo --dry-run )} \
              ${LIMIT:+--limit "$LIMIT"} \
              $( [ "$FORCE_PRUNE" = "true" ] && echo --force-prune ) || status=1
          done
          exit $status

      # Henry's states on LPT read his matviews; the hub's caches over them
      # are refilled here, after his weekday 15:00 UTC refresh.
      - name: Refresh hub caches for the LPT-native states
        env:
          LPT_SUPABASE_URL: https://rwiueylzgcgnzypdyszi.supabase.co
          LPT_SERVICE_ROLE_KEY: ${{ secrets.LPT_SERVICE_ROLE_KEY }}
          HIS_STATES: ${{ vars.LPT_HIS_STATES || 'GA OH OR' }}
        run: |
          if [ -z "$LPT_SERVICE_ROLE_KEY" ]; then exit 0; fi
          arr=$(printf '"%s",' $HIS_STATES); arr="[${arr%,}]"
          curl -fsS -X POST "${LPT_SUPABASE_URL}/rest/v1/rpc/hub_refresh_cache" \
            -H "apikey: ${LPT_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${LPT_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" -m 3600 \
            -d "{\"p_states\": ${arr}}"
