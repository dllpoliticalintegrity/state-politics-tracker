name: Polling sync

on:
  schedule:
    # Every 6 hours — polls drop throughout the day
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: polling-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The import-fiftyplusone-polling-multi Supabase edge function pulls
      # FiftyPlusOne's CSV API (governor_general) once and refreshes
      # race_polls + the race_polling aggregates for every live race (see
      # RACES in supabase/functions/import-fiftyplusone-polling-multi/index.ts)
      # using the project's own service role. The apikey below is the
      # project's publishable (anon) key — public by design, needed only to
      # pass the edge-function JWT check.
      #
      # No `-f` on curl: a per-race failure comes back as a 500 whose JSON
      # body names the race and the error, and we want that in the log. The
      # python check on `ok` is what fails the job.
      - name: Trigger FiftyPlusOne import (all live races)
        run: |
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvaHhkZnJ4bnh1eGpkdnZ5ZmpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMTQ5NzQsImV4cCI6MjA5ODU5MDk3NH0.vAaUdkMmbFPEO-1usZaTj9J4EcyJjnYzjAiDkSeaVYo"
          RESP=$(curl -sS -X POST \
            "https://lohxdfrxnxuxjdvvyfjc.supabase.co/functions/v1/import-fiftyplusone-polling-multi" \
            -H "Authorization: Bearer $ANON" \
            -H "apikey: $ANON" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "$RESP"
          echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('ok') else 1)"
