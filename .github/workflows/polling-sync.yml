name: Polling sync

on:
  schedule:
    # Every 6 hours — polls drop throughout the day
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: polling-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The import-fiftyplusone-polling-multi Supabase edge function pulls
      # FiftyPlusOne's governor CSVs (general + primary) once and refreshes
      # race_polls + the race_polling aggregates for every live governor race
      # (see RACES in supabase/functions/import-fiftyplusone-polling-multi/
      # index.ts) using the project's own service role. It replaced the
      # 270toWin scrape and Texas's single-race FiftyPlusOne import in Oct
      # 2026. The apikey below is the project's publishable (anon) key —
      # public by design, needed only to pass the edge-function JWT check. It
      # fails loudly (non-2xx, ok:false) if any race's import breaks.
      #
      # No curl -f here: on a 500 it would exit before the body is echoed,
      # hiding the per-race error list that says which state broke.
      #
      # --retry with --retry-all-errors covers transport failures (the 06:24 UTC
      # run on 2026-09-21 died on "Recv failure: Connection reset by peer"
      # before any response); plain --retry only counts timeouts and 429/5xx
      # as transient, and without -f an HTTP error is not a curl error, so the
      # body still gets echoed and judged below. The edge function refreshes
      # the same rows each time, so a repeated POST is harmless.
      - name: Trigger FiftyPlusOne import (all live races)
        run: |
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvaHhkZnJ4bnh1eGpkdnZ5ZmpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMTQ5NzQsImV4cCI6MjA5ODU5MDk3NH0.vAaUdkMmbFPEO-1usZaTj9J4EcyJjnYzjAiDkSeaVYo"
          CODE=$(curl -sS --retry 3 --retry-delay 15 --retry-all-errors \
            -o resp.json -w '%{http_code}' -X POST \
            "https://lohxdfrxnxuxjdvvyfjc.supabase.co/functions/v1/import-fiftyplusone-polling-multi" \
            -H "Authorization: Bearer $ANON" \
            -H "apikey: $ANON" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $CODE"
          cat resp.json; echo
          python3 - "$CODE" <<'PY'
          import json, sys
          code = sys.argv[1]
          try:
              d = json.load(open("resp.json"))
          except Exception as e:
              print(f"::error::non-JSON response (HTTP {code}): {e}")
              sys.exit(1)
          for slug, err in (d.get("errors") or {}).items():
              print(f"::error::{slug}: {err}")
          for f in d.get("failures") or []:
              print(f"::warning::{f}")
          if d.get("error"):
              print(f"::error::{d['error']}")
          ok = code.startswith("2") and bool(d.get("ok"))
          print("ok" if ok else "FAILED")
          sys.exit(0 if ok else 1)
          PY
